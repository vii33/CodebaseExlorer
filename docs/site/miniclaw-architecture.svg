<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">MiniClaw architecture overview</title>
  <desc id="desc">Assistant identity and behavior, memory management, and automation feed into the MiniClaw runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ab4ff"/>
    </marker>
    <style>
      .group { fill: #121a31; stroke: #2d3a63; stroke-width: 2; rx: 18; }
      .item { fill: #1a2545; stroke: #2d3a63; stroke-width: 1.5; rx: 12; }
      .runtime { fill: #16344d; stroke: #7cf0d6; stroke-width: 2; rx: 18; }
      .label { fill: #e7ecff; font: 600 20px Inter, Arial, sans-serif; }
      .small { fill: #e7ecff; font: 500 15px Inter, Arial, sans-serif; }
      .line { stroke: #8ab4ff; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="group" x="30" y="40" width="280" height="250"/>
  <text class="label" x="170" y="75" text-anchor="middle">Assistant identity and behavior</text>
  <rect class="item" x="55" y="100" width="230" height="32"/>
  <rect class="item" x="55" y="140" width="230" height="32"/>
  <rect class="item" x="55" y="180" width="230" height="32"/>
  <rect class="item" x="55" y="220" width="230" height="32"/>
  <rect class="item" x="55" y="260" width="230" height="32"/>
  <text class="small" x="170" y="121" text-anchor="middle">IDENTITY.md</text>
  <text class="small" x="170" y="161" text-anchor="middle">AGENTS.md</text>
  <text class="small" x="170" y="201" text-anchor="middle">SOUL.md</text>
  <text class="small" x="170" y="241" text-anchor="middle">USER.md</text>
  <text class="small" x="170" y="281" text-anchor="middle">TOOLS.md / skill instructions</text>

  <rect class="group" x="30" y="320" width="280" height="170"/>
  <text class="label" x="170" y="355" text-anchor="middle">Memory management</text>
  <rect class="item" x="55" y="380" width="230" height="24"/>
  <rect class="item" x="55" y="412" width="230" height="24"/>
  <rect class="item" x="55" y="444" width="230" height="24"/>
  <text class="small" x="170" y="397" text-anchor="middle">MEMORY.md</text>
  <text class="small" x="170" y="429" text-anchor="middle">memory/history + memory/knowledge</text>
  <text class="small" x="170" y="461" text-anchor="middle">memory/facts.md</text>

  <rect class="runtime" x="380" y="180" width="220" height="100"/>
  <text class="label" x="490" y="238" text-anchor="middle">MiniClaw runtime</text>

  <rect class="group" x="670" y="110" width="280" height="220"/>
  <text class="label" x="810" y="145" text-anchor="middle">Automation</text>
  <rect class="item" x="695" y="170" width="230" height="32"/>
  <rect class="item" x="695" y="210" width="230" height="32"/>
  <rect class="item" x="695" y="250" width="230" height="32"/>
  <rect class="item" x="695" y="290" width="230" height="32"/>
  <text class="small" x="810" y="191" text-anchor="middle">scripts/export-sessions.sh</text>
  <text class="small" x="810" y="231" text-anchor="middle">scripts/task-loop.js</text>
  <text class="small" x="810" y="271" text-anchor="middle">crons/tasks.yaml</text>
  <text class="small" x="810" y="311" text-anchor="middle">.miniclaw/task-state.json</text>

  <path class="line" d="M 310 165 C 345 165, 345 200, 380 220"/>
  <path class="line" d="M 310 400 C 360 400, 330 280, 380 240"/>
  <path class="line" d="M 670 220 C 635 220, 635 230, 600 230"/>
</svg>
