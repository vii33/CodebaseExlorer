<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">MiniClaw scheduler flow</title>
  <desc id="desc">The scheduler reads tasks and state, finds due tasks, skips duplicates, executes work, and updates success or failure state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ab4ff"/>
    </marker>
    <style>
      .box { fill: #121a31; stroke: #2d3a63; stroke-width: 2; rx: 16; }
      .decision { fill: #16344d; stroke: #7cf0d6; stroke-width: 2; }
      .label { fill: #e7ecff; font: 600 16px Inter, Arial, sans-serif; }
      .line { stroke: #8ab4ff; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .hint { fill: #adc0ff; font: 500 13px Inter, Arial, sans-serif; }
    </style>
  </defs>

  <rect class="box" x="30" y="45" width="170" height="58"/>
  <rect class="box" x="220" y="45" width="170" height="58"/>
  <rect class="box" x="410" y="45" width="170" height="58"/>
  <rect class="box" x="600" y="45" width="170" height="58"/>
  <polygon class="decision" points="855,35 930,74 855,113 780,74"/>
  <rect class="box" x="600" y="175" width="170" height="58"/>
  <polygon class="decision" points="855,165 930,204 855,243 780,204"/>
  <rect class="box" x="760" y="270" width="170" height="50"/>
  <rect class="box" x="560" y="270" width="170" height="50"/>

  <text class="label" x="115" y="70" text-anchor="middle">Read</text>
  <text class="label" x="115" y="90" text-anchor="middle">crons/tasks.yaml</text>
  <text class="label" x="305" y="70" text-anchor="middle">Parse enabled</text>
  <text class="label" x="305" y="90" text-anchor="middle">tasks</text>
  <text class="label" x="495" y="70" text-anchor="middle">Read</text>
  <text class="label" x="495" y="90" text-anchor="middle">task-state.json</text>
  <text class="label" x="685" y="70" text-anchor="middle">Find due tasks</text>
  <text class="label" x="685" y="90" text-anchor="middle">for this minute</text>
  <text class="label" x="855" y="68" text-anchor="middle">Already ran</text>
  <text class="label" x="855" y="88" text-anchor="middle">in slot?</text>
  <text class="label" x="685" y="200" text-anchor="middle">Execute task</text>
  <text class="label" x="855" y="198" text-anchor="middle">Success?</text>
  <text class="label" x="645" y="300" text-anchor="middle">Update last_error</text>
  <text class="label" x="845" y="300" text-anchor="middle">Update last_run</text>
  <text class="hint" x="740" y="58" text-anchor="middle">Yes → skip</text>
  <text class="hint" x="790" y="184" text-anchor="middle">No</text>
  <text class="hint" x="902" y="184" text-anchor="middle">Yes</text>

  <path class="line" d="M 200 74 H 220"/>
  <path class="line" d="M 390 74 H 410"/>
  <path class="line" d="M 580 74 H 600"/>
  <path class="line" d="M 770 74 H 780"/>
  <path class="line" d="M 855 113 V 145 C 855 160, 750 160, 685 175"/>
  <path class="line" d="M 855 74 V 20 H 960 V 204 H 930"/>
  <path class="line" d="M 770 204 H 780"/>
  <path class="line" d="M 855 243 V 270"/>
  <path class="line" d="M 820 235 C 785 245, 730 255, 645 270"/>
</svg>
